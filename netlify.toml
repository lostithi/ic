[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js runtime is auto-detected by Netlify (OpenNext adapter).
# Do not pin @netlify/plugin-nextjs unless you need a specific version.

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep apex as the canonical host once the custom domain is attached.
[[redirects]]
  from = "https://www.illegalithi.com/*"
  to = "https://illegalithi.com/:splat"
  status = 301
  force = true
