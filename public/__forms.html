<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Illegalithi Creations form detection</title>
  </head>
  <body>
    <!--
      Netlify Forms needs a static HTML form present at deploy time.
      The live UI posts to this same form name from ContactForm.tsx.
    -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="projectType" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
